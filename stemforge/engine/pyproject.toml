[project]
name = "stemforge"
version = "1.0.0"
description = "Stem separation, tempo/key analysis and synced lyrics for Ableton Live and the desktop"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "audio-separator>=0.47,<0.48",
  "audioread>=3.0",
  "imageio-ffmpeg>=0.6",
  "librosa>=1.0,<2",
  "numpy>=2",
  "soundfile>=0.13",
  "faster-whisper>=1.2,<2",
]
# torch / torchaudio and the ONNX Runtime flavour are installed by the installer,
# which picks the CUDA or CPU build for the machine.

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
stemforge = "stemforge.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stemforge*"]
