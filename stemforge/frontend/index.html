<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d12">
  <title>StemForge</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0d12'/%3E%3Cg fill='%23ff8a3d'%3E%3Crect x='6' y='12' width='3' height='8' rx='1.5'/%3E%3Crect x='11' y='7' width='3' height='18' rx='1.5'/%3E%3Crect x='16' y='10' width='3' height='12' rx='1.5'/%3E%3Crect x='21' y='5' width='3' height='22' rx='1.5'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><rect x="6" y="12" width="3" height="8" rx="1.5"/><rect x="11" y="7" width="3" height="18" rx="1.5"/><rect x="16" y="10" width="3" height="12" rx="1.5"/><rect x="21" y="5" width="3" height="22" rx="1.5"/></g></svg>
      <span>Stem<b>Forge</b></span>
    </div>
    <div class="topbar-actions">
      <button class="btn ghost" id="newTrackBtn" hidden>New track</button>
      <button class="btn ghost" id="historyBtn" aria-expanded="false" aria-controls="historyPanel">History</button>
    </div>
  </header>

  <main id="app">
    <!-- Upload -->
    <section id="dropSection" class="card drop-card">
      <label id="dropzone" class="dropzone" tabindex="0">
        <input id="fileInput" type="file" accept=".wav,.mp3,.m4a,.flac,audio/wav,audio/mpeg,audio/mp4,audio/flac" hidden>
        <svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 31V11m0 0-7 7m7-7 7 7M10 30v5a4 4 0 0 0 4 4h20a4 4 0 0 0 4-4v-5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <strong>Drop an audio file to forge stems</strong>
        <span>WAV · MP3 · M4A · FLAC — one file at a time</span>
        <span class="btn primary">Choose file</span>
      </label>
      <div id="uploadStatus" class="upload-status" hidden>
        <div class="progress"><div class="progress-bar" id="uploadBar"></div></div>
        <span id="uploadText">Uploading…</span>
      </div>
    </section>

    <!-- Track -->
    <section id="trackSection" class="card track-card" hidden>
      <div class="track-head">
        <div>
          <h1 id="trackTitle">—</h1>
          <div class="track-file" id="trackFile"></div>
        </div>
        <div class="chips" id="trackChips"></div>
      </div>
      <div class="mix-wave" id="mixWave">
        <canvas></canvas>
        <div class="loop-region" hidden></div>
        <div class="playhead"></div>
        <div class="wave-hint">Drag to set a loop region · click to seek</div>
      </div>
      <div id="engineNote" class="notice warn" hidden></div>
      <div class="separate-row" id="separateRow">
        <button class="btn primary big" id="separateBtn">Separate stems</button>
        <div class="sep-progress" id="sepProgress" hidden>
          <div class="progress"><div class="progress-bar" id="sepBar"></div></div>
          <span id="sepStage">Queued</span>
        </div>
      </div>
      <div id="trackError" class="notice error" hidden></div>
    </section>

    <!-- Mixer -->
    <section id="mixerSection" class="card mixer-card" hidden>
      <div class="transport" id="transport">
        <div class="transport-left">
          <button class="icon-btn play" id="playBtn" aria-label="Play">
            <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn" id="stopBtn" aria-label="Return to start">
            <svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z" fill="currentColor"/></svg>
          </button>
          <button class="icon-btn toggle" id="loopBtn" aria-pressed="false" aria-label="Loop region">
            <svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4m14-1v2a3 3 0 0 1-3 3H3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <div class="time"><span id="timeNow">0:00.0</span><span class="dim"> / <span id="timeTotal">0:00</span></span></div>
          <div class="loop-readout dim" id="loopReadout"></div>
        </div>
        <div class="transport-right">
          <label class="master">
            <span>Master</span>
            <input type="range" id="masterVol" min="0" max="1.25" step="0.01" value="1">
          </label>
          <button class="btn" id="recombineBtn" title="Bounce your current mute/solo/volume mix to a new WAV">Recombine</button>
          <a class="btn primary" id="zipBtn" download>Download all</a>
        </div>
      </div>
      <div id="liteNote" class="notice info" hidden>Lite playback (22 kHz) is on to save memory on this device. Downloads and Recombine are always full quality.</div>
      <div id="loadNote" class="notice info" hidden></div>
      <div class="lanes" id="lanes"></div>
    </section>
  </main>

  <aside id="historyPanel" class="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2>Session history</h2>
      <button class="icon-btn" id="historyClose" aria-label="Close history">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <p class="dim small">Last 10 separated tracks. Older sessions are removed automatically.</p>
    <ul id="historyList" class="history-list"></ul>
  </aside>
  <div id="scrim" class="scrim" hidden></div>
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <template id="laneTpl">
    <div class="lane">
      <div class="lane-head">
        <span class="swatch"></span>
        <div class="lane-name">
          <strong></strong>
          <span class="lane-sub"></span>
        </div>
        <div class="lane-controls">
          <button class="ms mute" aria-pressed="false" title="Mute">M</button>
          <button class="ms solo" aria-pressed="false" title="Solo">S</button>
          <input class="fader" type="range" min="0" max="1.5" step="0.01" value="1" aria-label="Volume">
          <a class="icon-btn small dl" title="Download WAV" download>
            <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </a>
          <div class="send">
            <button class="icon-btn small send-btn" title="Send to remix" aria-haspopup="menu">
              <svg viewBox="0 0 24 24"><path d="M5 12h12m0 0-5-5m5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <div class="send-menu" role="menu" hidden>
              <button role="menuitem" data-target="replace">Send to Replace</button>
              <button role="menuitem" data-target="extend">Send to Extend</button>
              <button role="menuitem" data-target="cover">Send to Cover</button>
            </div>
          </div>
        </div>
      </div>
      <div class="lane-wave">
        <canvas></canvas>
        <div class="loop-region" hidden></div>
        <div class="playhead"></div>
        <div class="lane-empty"></div>
      </div>
    </div>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
