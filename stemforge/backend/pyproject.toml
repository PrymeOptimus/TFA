[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stemforge"
version = "1.1.0"
description = "StemForge stem separation engine (web app + DAW plug-in backend)"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9", "numpy>=1.26", "scipy>=1.11",
  "librosa>=0.10", "soundfile>=0.12", "httpx>=0.27", "pydantic>=2.5",
]

[project.optional-dependencies]
ml = ["torch>=2.1", "demucs>=4.0.1"]
test = ["pytest>=8"]

[project.scripts]
stemforge = "stemforge.__main__:main"

[tool.setuptools]
packages = ["stemforge"]
