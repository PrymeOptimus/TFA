# Local development only. Provides PostgreSQL 16 with the crm_owner / crm_app / crm_system roles
# and the crm_dev + crm_test databases (infra/postgres/01-bootstrap.sql). Not a production plan.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres_local_only
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  pgdata:
